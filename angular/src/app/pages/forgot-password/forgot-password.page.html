<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
    <div class="w-full max-w-md bg-white p-8 rounded shadow">
        <h1 class="text-2xl font-semibold mb-2">Réinitialiser le mot de passe</h1>
        <p class="text-sm text-gray-600 mb-6">Entrez votre adresse e-mail pour recevoir un lien de réinitialisation.</p>

        <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" novalidate>
            <div class="mb-4">
                <label class="f-label">Email</label>
                <input type="email" formControlName="email" class="f-input"
                    placeholder="votre@email.com" aria-label="Email" />
    
                <p class="f-text-error" *ngIf="isInvalid('email')">
                    {{ getMessageError('email') }}
                </p>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Envoyer</button>
        </form>

        <div class="c-success-message mt-4" *ngIf="success$ | async as msg">
            {{ msg }}
        </div>

        <a routerLink="/login" class="mt-4 block text-sm text-blue-600">Retour à la connexion</a>
    </div>
</div>
