<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-white">
    <div class="max-w-md w-full">
        <div class="mb-8">
            <h2 class="f-title text-center">
                Changer votre mot de passe
            </h2>
        </div>
        <div class="mb-4">
            <form [formGroup]="changePasswordForm" (ngSubmit)="onChangePasswordSubmit()" class="space-y-4">
                <div>
                    <label class="f-label">Mot de passe actuel</label>
                    <input type="password" autocomplete="current-password" required class="f-input"
                        formControlName="password" />
                    <p class="f-text-error" *ngIf="isInvalid('password')">
                        {{ getMessageError('password') }}
                    </p>
                </div>
                <div>
                    <label class="f-label">Nouveau mot de passe</label>
                    <input type="password" autocomplete="new-password" required class="f-input"
                        formControlName="newPassword" />
                    <p class="f-text-error" *ngIf="isInvalid('newPassword')">
                        {{ getMessageError('newPassword') }}
                    </p>
                </div>
                <div>
                    <label class="f-label">Confirmer le nouveau mot de passe</label>
                    <input type="password" autocomplete="new-password" required class="f-input"
                        formControlName="confirmPassword" />
                    <p class="f-text-error" *ngIf="isInvalid('confirmPassword')">
                        {{ getMessageError('confirmPassword') }}
                    </p>
                </div>

                <div *ngIf="successMessage()" class="c-success-message">
                    {{ successMessage() }}
                </div>

                <div *ngIf="errorMessage()" class="c-error-message">
                    {{ errorMessage() }}
                </div>

                <div>
                    <button type="submit" class="btn-primary w-full">
                        Changer le mot de passe
                    </button>
                </div>
            </form>
        </div>
        <p>Revenir à la page de <a class="text-blue-500 hover:text-blue-700 underline" routerLink="/profile">profile</a></p>
    </div>
</div>
